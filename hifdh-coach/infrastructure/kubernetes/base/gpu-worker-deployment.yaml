apiVersion: apps/v1
kind: Deployment
metadata:
  name: hifdh-gpu-worker
  namespace: hifdh-coach
  labels:
    app: hifdh-gpu-worker
    component: ai
spec:
  # Replica count managed by HPA
  selector:
    matchLabels:
      app: hifdh-gpu-worker
  template:
    metadata:
      labels:
        app: hifdh-gpu-worker
        component: ai
    spec:
      # Schedule on GPU nodes
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gpu-worker
          image: ghcr.io/hifdh-coach/gpu-worker:v1.0.0
          envFrom:
            - secretRef:
                name: hifdh-secrets
            - configMapRef:
                name: hifdh-config
          env:
            - name: WHISPER_DEVICE
              value: "cuda"
            - name: WHISPER_MODEL_SIZE
              value: "large-v3"
            - name: XDG_CACHE_HOME
              value: "/home/hifdh/.cache"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "4000m"
              memory: "16Gi"
              nvidia.com/gpu: "1"
          startupProbe:
            exec:
              command:
                - celery
                - -A
                - app.tasks.celery_app:celery_app
                - inspect
                - ping
                - --timeout
                - "10"
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - app.tasks.celery_app:celery_app
                - inspect
                - ping
                - --timeout
                - "10"
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - app.tasks.celery_app:celery_app
                - inspect
                - ping
                - --timeout
                - "10"
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: model-cache
              mountPath: /home/hifdh/.cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: whisper-model-cache
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-model-cache
  namespace: hifdh-coach
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: gp3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hifdh-gpu-worker-hpa
  namespace: hifdh-coach
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hifdh-gpu-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: celery_queue_length_gpu
        target:
          type: AverageValue
          averageValue: "5"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hifdh-gpu-worker-pdb
  namespace: hifdh-coach
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hifdh-gpu-worker
