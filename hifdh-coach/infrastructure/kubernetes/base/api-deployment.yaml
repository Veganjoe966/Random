apiVersion: apps/v1
kind: Deployment
metadata:
  name: hifdh-api
  namespace: hifdh-coach
  labels:
    app: hifdh-api
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hifdh-api
  template:
    metadata:
      labels:
        app: hifdh-api
        component: backend
    spec:
      serviceAccountName: hifdh-api
      containers:
        - name: api
          image: ghcr.io/hifdh-coach/api:latest
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: hifdh-secrets
            - configMapRef:
                name: hifdh-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hifdh-api
  namespace: hifdh-coach
spec:
  selector:
    app: hifdh-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hifdh-api-hpa
  namespace: hifdh-coach
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hifdh-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
