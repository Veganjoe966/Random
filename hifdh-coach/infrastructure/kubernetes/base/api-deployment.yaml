apiVersion: apps/v1
kind: Deployment
metadata:
  name: hifdh-api
  namespace: hifdh-coach
  labels:
    app: hifdh-api
    component: backend
spec:
  # Replica count managed by HPA — do not set replicas here
  selector:
    matchLabels:
      app: hifdh-api
  template:
    metadata:
      labels:
        app: hifdh-api
        component: backend
    spec:
      serviceAccountName: hifdh-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: hifdh-api
      initContainers:
        - name: run-migrations
          image: ghcr.io/hifdh-coach/api:v1.0.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: hifdh-secrets
            - configMapRef:
                name: hifdh-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/hifdh-coach/api:v1.0.0
          ports:
            - containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: hifdh-secrets
            - configMapRef:
                name: hifdh-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hifdh-api
  namespace: hifdh-coach
spec:
  selector:
    app: hifdh-api
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hifdh-api-hpa
  namespace: hifdh-coach
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hifdh-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hifdh-api-pdb
  namespace: hifdh-coach
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hifdh-api
